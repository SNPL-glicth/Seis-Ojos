[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sixeyes"
version = "0.1.0"
description = "Six Eyes: detector de anomalías en series de tiempo en modo streaming"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = [
    ".",
    "../benchmarks/tsb_ad/TSB-AD"
]
