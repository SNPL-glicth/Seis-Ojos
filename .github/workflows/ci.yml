name: sixeyes-ci
on: [push, pull_request]
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest tests/test_no_nab_names.py tests/test_repo_guards.py tests/test_peak_decay.py tests/test_peak_decay_reset.py -v
